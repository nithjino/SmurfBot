services:
  smurfbot:
    build:
      context: .
    image: smurfbot:latest
    container_name: smurfbot
    restart: unless-stopped
    init: true
    mem_limit: "200m"
    cpus: "0.5"
    environment:
      SMURFBOT_DELIM: '$' # Single quotes prevent Docker Compose from treating $ as variable interpolation.
      SMURFBOT_LOG_LEVEL: "INFO"
      SMURFBOT_DISCORD_TOKEN: "${SMURFBOT_DISCORD_TOKEN:-}" # Read from .env.
    volumes:
      - ./data:/home/smurfbot/data
