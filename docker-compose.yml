services:
  smurfbot:
    build:
      context: .
    image: smurfbot:latest
    container_name: smurfbot
    restart: unless-stopped
    init: true
    mem_limit: "200m"
    cpus: "0.5"
    volumes:
      - ./config.ini:/home/smurfbot/app/config.ini:ro
      - ./src/tags/files:/home/smurfbot/app/src/tags/files
      - ./src/reminders/files:/home/smurfbot/app/src/reminders/files
